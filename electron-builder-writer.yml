appId: com.oscard.prismawriter
productName: Prisma Writer
extraMetadata:
  name: prisma-writer
  version: 1.1.1
  prismaProduct: writer
directories:
  output: release-writer
files:
  - dist-writer/**/*
  - desktop/**/*
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/writer-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Prisma-Writer-${version}-Windows-Setup.exe
