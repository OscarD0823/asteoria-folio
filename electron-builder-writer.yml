appId: com.oscard.prismawriter
productName: Prisma Writer
directories:
  output: release-writer
extraMetadata:
  name: prisma-writer
  version: 1.3.0
  prismaProduct: writer
files:
  - dist-writer/**/*
  - desktop/**/*
  - engines/**/*
  - vendor/genoffice/dist/*.cjs
  - vendor/genoffice/LICENSE
  - vendor/genoffice/NOTICE
  - vendor/genoffice/SOURCE.json
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/writer-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Prisma-Writer-${version}-Windows-Setup.exe
