appId: com.oscard.prismaslides
productName: Prisma Slides
directories:
  output: release-slides
extraMetadata:
  name: prisma-slides
  version: 0.1.0
  prismaProduct: slides
files:
  - dist-slides/**/*
  - desktop/**/*
  - engines/**/*
  - vendor/genoffice/dist/*.cjs
  - vendor/genoffice/LICENSE
  - vendor/genoffice/NOTICE
  - vendor/genoffice/SOURCE.json
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/slides-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Prisma-Slides-${version}-Windows-Setup.exe
