name: Publicar Prisma PDF
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '12,27,42,57 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  product:
    uses: OscarD0823/prisma/.github/workflows/product-pages.yml@main
    with:
      kind: pdf
