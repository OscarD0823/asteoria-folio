appId: com.oscard.prismapublisher
productName: Prisma Publisher
directories:
  output: release-publisher
extraMetadata:
  name: prisma-publisher
  version: 0.2.1
  prismaProduct: publisher
files:
  - dist-publisher/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/publisher-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Prisma-Publisher-${version}-Windows-Setup.exe
