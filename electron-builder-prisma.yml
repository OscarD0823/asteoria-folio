appId: com.oscard.prisma
productName: Prisma
directories:
  output: release-prisma
extraMetadata:
  name: prisma-prisma
  version: 1.0.0
  prismaProduct: prisma
files:
  - dist-prisma/**/*
  - desktop/**/*
  - engines/**/*
  - engines/dist/*.cjs
  - products.json
  - package.json
  - "!node_modules/**/*"
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/prisma-icons/prisma.ico
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: Prisma-${version}-Windows-Setup.exe
